name: Sync lore and Git data

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      since:
        description: "Optional backfill start date, for example 2025-01-01"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: zhujian-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Select the daily Git cache
        id: git-cache-date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore cached Linux repositories
        uses: actions/cache@v6
        with:
          path: .cache/git
          key: linux-git-v1-${{ runner.os }}-${{ steps.git-cache-date.outputs.date }}
          restore-keys: |
            linux-git-v1-${{ runner.os }}-

      - name: Install lei
        run: |
          sudo apt-get update
          sudo apt-get install --yes public-inbox lei
          lei q --help >/dev/null

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Synchronize and generate tracking data
        env:
          SYNC_SINCE: ${{ inputs.since }}
        run: pnpm sync

      - name: Validate generated data
        run: pnpm validate:data

      - name: Run tests
        run: pnpm test

      - name: Commit generated data
        run: |
          if git diff --quiet -- data; then
            echo "Generated data is unchanged."
            exit 0
          fi
          git config user.name "zhujian data bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "data: update patch tracking status [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"

      - name: Publish synchronization failure state
        if: failure()
        run: |
          if git diff --quiet -- data/internal/sync-state.json; then
            echo "No synchronization failure state was generated."
            exit 0
          fi
          git config user.name "zhujian data bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/internal/sync-state.json
          git commit -m "data: record synchronization failure [skip ci]"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
